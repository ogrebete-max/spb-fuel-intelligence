name: Refresh fuel data and deploy public map

on:
  workflow_dispatch:
  schedule:
    # 15 minutes is intentionally conservative for public third-party sources.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "spb-fuel-refresh"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch public station-level sources and update history
        run: python scripts/refresh_live.py

      - name: Persist only temporal history
        run: |
          git config user.name "spb-fuel-bot"
          git config user.email "spb-fuel-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Update fuel-status history"
          git push

      - name: Build static public map from the fresh snapshot
        run: python scripts/build_static_site.py --output site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public map artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy public map
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
