name: Refresh fuel data and build mobile map

on:
  workflow_dispatch:
  schedule:
    # 15 minutes is intentionally conservative for public third-party sources.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: "spb-fuel-refresh"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch public station-level sources and update history
        run: python scripts/refresh_live.py

      - name: Persist only temporal history
        run: |
          git config user.name "spb-fuel-bot"
          git config user.email "spb-fuel-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Update fuel-status history"
          git push

      - name: Build static public map from the fresh snapshot
        run: python scripts/build_static_site.py --output site

      - name: Preserve deployable mobile map
        uses: actions/upload-artifact@v4
        with:
          name: spb-fuel-site
          path: site
          retention-days: 2
          compression-level: 9

      - name: Check out public deployment repository
        uses: actions/checkout@v5
        with:
          repository: ogrebete-max/spb-fuel-intelligence-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: public-site

      - name: Publish fresh mobile map
        run: |
          rsync -a --delete --exclude .git/ site/ public-site/
          cd public-site
          git config user.name "spb-fuel-bot"
          git config user.email "spb-fuel-bot@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Update public fuel map"
          git push origin main
